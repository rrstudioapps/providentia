name: Feature request
description: Suggest a page, component or improvement for Providentia.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How you imagine it working. Screenshots or links to examples are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Overview
        - Users
        - Reports
        - Billing
        - Settings
        - Auth
        - Theme and layout
        - API layer / backend integration
        - Other
